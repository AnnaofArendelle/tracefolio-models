[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tracefolio-worker"
version = "0.1.0.dev0"
description = "Bounded extraction workers for Tracefolio"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
dependencies = [
  "numpy==2.2.6",
  "onnxruntime==1.23.2",
  "opencv-python-headless==5.0.0.93",
  "rapidocr==3.10.0",
  "sherpa-onnx==2.0.1",
  "pypdfium2==5.15.1",
  "pillow==12.3.0",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "python-pptx==1.0.2",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/tracefolio_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
